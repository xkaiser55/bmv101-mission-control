<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f7a5a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Mission Control">
    <title>BMV101 Mission Control</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">BigMoneyVision101 / OpenClaw</p>
        <h1>Mission Control</h1>
        <p class="header-subtitle">v1.3 private local/mock operations dashboard</p>
      </div>
      <div class="status-pill" aria-label="Local-only status">
        <span class="status-dot"></span>
        Local Only
      </div>
    </header>

    <label class="mobile-page-picker" for="mobilePageSelect">
      <span>Current view</span>
      <select id="mobilePageSelect" aria-label="Mission Control pages"></select>
    </label>

    <main class="app-shell">
      <aside class="sidebar" aria-label="Mission Control navigation">
        <div class="brand-block">
          <strong>Mission Control</strong>
          <span>v1.3 safe prototype</span>
        </div>
        <nav class="side-nav" id="sideNav"></nav>
      </aside>

      <section class="content" id="app" aria-live="polite"></section>
    </main>

    <template id="emptyStateTemplate">
      <div class="empty-state">
        <h3>No items yet</h3>
        <p>Local mock events will appear here after prototype actions run.</p>
      </div>
    </template>

    <script src="bridge.js"></script>
    <script src="app.js"></script>
  </body>
</html>
