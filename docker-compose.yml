services:
  mission-control:
    build:
      context: .
      dockerfile: Dockerfile
    image: bmv101-mission-control:local
    container_name: bmv101-mission-control
    ports:
      - "4175:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
